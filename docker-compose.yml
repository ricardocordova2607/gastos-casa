# Ambiente local: docker compose up --build  ->  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos_app
      POSTGRES_PASSWORD: gastos_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos_app -d gastos"]
      interval: 5s
      retries: 10

  app:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gastos
      DB_USER: gastos_app
      DB_PASSWORD: gastos_app
      DB_SSL: "false"
      ADMIN_NAME: Administrador
      ADMIN_EMAIL: admin@casa.local
      ADMIN_PASSWORD: trocar-esta-senha
    ports:
      - "3000:3000"

volumes:
  pgdata:
